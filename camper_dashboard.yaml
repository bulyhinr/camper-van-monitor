        it.print(713, 307, id(font_card_title), COLOR_ON, TextAlign::TOP_CENTER, "UNEVEN");
      } else {
        it.print(712, 307, id(font_card_title), COLOR_ON, TextAlign::TOP_CENTER, "READY");
