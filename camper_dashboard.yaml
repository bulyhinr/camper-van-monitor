        it.print(770, 422, id(font_sub), COLOR_ON, TextAlign::TOP_RIGHT, "--°");
      } else {
        it.printf(770, 422, id(font_sub), COLOR_ON, TextAlign::TOP_RIGHT, "%+.1f°", pitch);
