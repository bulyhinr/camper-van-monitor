        it.rectangle(380, 353, 102, 32, COLOR_ON);
        it.print(431, 359, id(font_card_title), COLOR_ON, TextAlign::TOP_CENTER, "OPEN");
        it.print(432, 359, id(font_card_title), COLOR_ON, TextAlign::TOP_CENTER, "OPEN");
      } else {
