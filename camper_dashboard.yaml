      it.print(26, 409, id(font_body), COLOR_ON, "AIR & SAFETY:");
      it.print(26, 428, id(font_card_title), COLOR_ON, "NORMAL");
      it.print(27, 428, id(font_card_title), COLOR_ON, "NORMAL");
      it.print(26, 448, id(font_body), COLOR_ON, "2 Zones Safe");

      // --- ПРАВАЯ КОЛОНКА (3 ЛЮКА, x: 205..500) ---
      // Разделители строк люков
      it.line(205, 338, 500, 338, COLOR_ON);
      it.line(205, 401, 500, 401, COLOR_ON);

      // Люк 1 (Ванная / Санузел)
      it.print(222, 286, id(font_card_title), COLOR_ON, "HATCH 1");
      it.print(223, 286, id(font_card_title), COLOR_ON, "HATCH 1");
      it.print(222, 312, id(font_body), COLOR_ON, "Bathroom Area");
