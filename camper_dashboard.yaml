        it.print(770, 372, id(font_sub), COLOR_ON, TextAlign::TOP_RIGHT, "--°");
      } else {
        it.printf(770, 372, id(font_sub), COLOR_ON, TextAlign::TOP_RIGHT, "%+.1f°", roll);
        it.printf(771, 372, id(font_sub), COLOR_ON, TextAlign::TOP_RIGHT, "%+.1f°", roll);
      }

      // Разделитель
