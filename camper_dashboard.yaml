        it.printf(26, 362, id(font_large), COLOR_ON, "%.1f°C", id(temp_outside).state);
        it.printf(27, 362, id(font_large), COLOR_ON, "%.1f°C", id(temp_outside).state);
      }

      it.line(20, 401, 200, 401, COLOR_ON);

