      it.print(526, 253, id(font_card_title), COLOR_ON, "PARKING LEVEL");

      float roll = id(tilt_roll).state;
      float pitch = id(tilt_pitch).state;

      // Пузырьковый уровень
      it.rectangle(530, 287, 110, 60, COLOR_ON);
      it.line(530, 317, 640, 317, COLOR_ON);
      it.line(585, 287, 585, 347, COLOR_ON);

      int b_x = 585;
      int b_y = 317;
      if (!isnan(roll) && !isnan(pitch)) {
        // Пузырек всплывает в высшую точку (Y-влево -> b_x-=roll; X-вперед -> b_y-=pitch)
        b_x -= (int)(roll * 6.0);
        b_y -= (int)(pitch * 6.0);
        if (b_x < 536) b_x = 536;
        if (b_x > 634) b_x = 634;
        if (b_y < 293) b_y = 293;
        if (b_y > 341) b_y = 341;
      }
      it.circle(b_x, b_y, 6, COLOR_ON);
      it.circle(b_x, b_y, 5, COLOR_ON);

      // Бейдж статуса горизонта (двойная контурная рамка)
      bool level_ok = (!isnan(roll) && !isnan(pitch) && abs(roll) <= 2.0 && abs(pitch) <= 2.0);
      it.rectangle(655, 299, 115, 36, COLOR_ON);
      it.rectangle(657, 301, 111, 32, COLOR_ON);
      if (level_ok) {
