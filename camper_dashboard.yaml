      // Люк 2 (Средний / Кухня)
      it.print(222, 349, id(font_card_title), COLOR_ON, "HATCH 2");
      it.print(223, 349, id(font_card_title), COLOR_ON, "HATCH 2");
      it.print(222, 375, id(font_body), COLOR_ON, "Kitchen Area");
