      it.print(25, 253, id(font_card_title), COLOR_ON, "CLIMATE & ROOF HATCHES");
      it.print(26, 253, id(font_card_title), COLOR_ON, "CLIMATE & ROOF HATCHES");

      // Вертикальный разделитель между климатом и 3 люками
      it.line(205, 275, 205, 465, COLOR_ON);

      // --- ЛЕВАЯ КОЛОНКА (КЛИМАТ И ГАЗ, x: 15..205) ---
      // 1. Температура внутри (Салон)
      it.print(26, 282, id(font_body), COLOR_ON, "INSIDE");
      if (isnan(id(temp_inside).state)) {
        it.print(26, 299, id(font_large), COLOR_ON, "--.-°C");
      } else {
        it.printf(26, 299, id(font_large), COLOR_ON, "%.1f°C", id(temp_inside).state);
        it.printf(27, 299, id(font_large), COLOR_ON, "%.1f°C", id(temp_inside).state);
